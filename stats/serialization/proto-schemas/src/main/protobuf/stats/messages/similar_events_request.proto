syntax = "proto3";

package stats.messages;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";

message SimilarEventsRequestProto {
  int64 event_id = 1;  // идентификатор мероприятия
  int64 user_id = 2;   // идентификатор пользователя
  int32 max_results = 3; // ограничение количества мероприятий
}